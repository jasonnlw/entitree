<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Family Tree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/family-chart-lite.css" />
  <style>
  /* Remove internal scrollbars in iframe */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* KEY: removes iframe scrollbars */
  }

  /* The SVG/D3 container should fill the iframe */
  #tree {
    width: 100%;
    height: 100vh; /* Full viewport height inside iframe */
  }
</style>

</head>
<body>
  <div id="tree"></div>

  <!-- 1) Local D3 runtime (download once) -->
  <script src="js/d3.v7.min.js"></script>

  <!-- 2) Our renderer -->
  <script type="module">
    import { drawFamilyTree } from "./js/family-chart-lite.js";

    const params = new URLSearchParams(location.search);
    const qid = params.get("item");               // e.g. Q64751
    const lang = (params.get("lang")==="cy") ? "cy" : "en"; // cy|en

    const el = document.getElementById("tree");
    if (!qid) {
      el.innerHTML = "<div style='padding:1rem'>Missing ?item=Qxxxx</div>";
    } else {
      drawFamilyTree(el, qid, { lang });

      // --- Reliable auto-height system for iframe embedding ---
function sendTreeHeight() {
  const tree = document.getElementById("tree");
  if (!tree) return;

  // Measure the actual rendered height of the SVG content
  const svg = tree.querySelector("svg");
  if (!svg) return;

  // ScrollHeight or getBBox fallback
  const contentHeight = Math.max(
    tree.scrollHeight,
    svg.getBoundingClientRect().height,
    svg.viewBox.baseVal.height
  );

  window.parent.postMessage({ entitreeHeight: contentHeight }, "*");
}

// Wait for layout stabilization
const stabilizationDelays = [200, 400, 800, 1200, 2000];

stabilizationDelays.forEach(delay => {
  setTimeout(sendTreeHeight, delay);
});

// Recompute on zoom/pan
window.addEventListener("resize", sendTreeHeight);


      // --- Auto-height iframe support ---
function sendHeight() {
  const h = document.body.scrollHeight;
  window.parent.postMessage({ entitreeHeight: h }, "*");
}

window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);

// Also re-check height periodically (trees may grow after render)
setTimeout(sendHeight, 250);
setTimeout(sendHeight, 500);
setTimeout(sendHeight, 1000);

    }
  </script>
</body>
</html>
